# Personal assistant branch: sign the owner in, then register the agent for them.
- id: prompt_agent_kind
  type: PROMPT
  meta:
    components:
    - align: left
      type: TEXT
      id: heading_agent_kind
      label: Assistant kind
      variant: HEADING_1
    - align: left
      type: TEXT
      id: subtitle_agent_kind
