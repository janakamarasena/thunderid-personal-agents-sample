        variant: PRIMARY
        eventType: SUBMIT
  prompts:
  - inputs:
    - ref: input_agent_kind
      identifier: kind
      type: TEXT_INPUT
      required: true
    action:
      ref: action_agent_kind
      nextNode: agent_type_resolution
  layout:
    size:
      width: 350
      height: 320
    position:
      x: 640
      y: 800
- id: agent_type_resolution
  type: TASK_EXECUTION
  properties:
    allowedAgentTypes:
    - default
  executor:
    name: AgentTypeResolver
  onSuccess: agent_provisioning
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 1240
      y: 910
- id: prompt_agent_details
  type: PROMPT
  meta:
    components:
    - align: left
      type: TEXT
      id: text_header_agent_details
      label: Register your assistant
      variant: HEADING_1
    - align: left
      type: TEXT
      id: text_subtitle_agent_details
      label: The assistant acts only for you. Describe it, tell us where to send you back after you approve it, and give its public key if it has one.
      variant: HEADING_6
    - type: BLOCK
      id: block_agent_details
      components:
      - type: DYNAMIC_INPUT_PLACEHOLDER
        id: dynamic_agent_inputs
      - id: input_agent_redirect_uris
        ref: redirectUris
        type: TEXT_INPUT
        label: Redirect URIs
        required: true
        placeholder: Where to send you back after you approve the assistant. Separate several with commas
      - id: input_agent_jwks_uri
        ref: jwksUri
        type: TEXT_INPUT
        label: JWKS URI
        required: false
        placeholder: Optional. The URI that serves the assistant's public keys
      - id: input_agent_public_key
        ref: publicKey
        type: TEXT_INPUT
        label: Public Key
        required: false
        placeholder: Optional. The assistant's public keys as a JWKS document
      - type: ACTION
        id: action_agent_details
        label: Register Assistant
        variant: PRIMARY
        eventType: SUBMIT
  prompts:
  - inputs:
    - ref: input_agent_redirect_uris
      identifier: redirectUris
      type: TEXT_INPUT
      required: true
    - ref: input_agent_jwks_uri
      identifier: jwksUri
      type: TEXT_INPUT
      required: false
    - ref: input_agent_public_key
      identifier: publicKey
      type: TEXT_INPUT
      required: false
    action:
      ref: action_agent_details
      nextNode: agent_provisioning
  layout:
    size:
      width: 350
      height: 500
    position:
      x: 1520
      y: 400
- id: agent_provisioning
  type: TASK_EXECUTION
  properties:
    includeOptional: true
  executor:
    name: ProvisioningExecutor
    # The assistant signs in through the sample's sign-in flow, whose pages call it the owner's assistant.
    inputs:
    - identifier: authFlowHandle
      type: TEXT_INPUT
      required: true
      defaultValue: personal-assistant-sign-in-flow
      constant: true
    # Every assistant gets a robot as its logo.
    - identifier: logoUrl
      type: TEXT_INPUT
      required: true
      defaultValue: "emoji:🤖"
      constant: true
  onSuccess: agent_credentials
  onIncomplete: prompt_agent_details
  onFailure: prompt_agent_details
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 1520
      y: 910
- id: agent_credentials
  type: PROMPT
  meta:
    components:
    - align: left
      type: TEXT
      id: agent_credentials_heading
      label: Assistant Registered Successfully
      variant: HEADING_1
      color: SUCCESS
    - align: left
      type: TEXT
      id: agent_credentials_message
      label: Copy these values now. When no key was given, the client secret is shown only once and cannot be retrieved later.
      variant: HEADING_6
    - type: COPYABLE_TEXT
      id: agent_credentials_client_id
      label: Assistant identifier
      source: clientId
    - type: COPYABLE_TEXT
      id: agent_credentials_client_secret
      label: '{{ t(agentOnboarding:forms.credentials.client_secret_label) }}'
      source: clientSecret
      masked: true
  message: Assistant registered successfully
  next: end
  layout:
    size:
      width: 350
      height: 520
    position:
      x: 1800
      y: 800
- id: end
  type: END
  layout:
    size:
      width: 85
      height: 34
    position:
      x: 2160
      y: 480

---
# --- an assistant registering itself ------------------------------------------
#
# The approval an assistant's registration needs from its owner, which the self registration flow below
# calls. It takes the owner's email, which the assistant gives, and emails the owner a magic link to
# ThunderID's sign-in pages. Opening the link there verifies it and signs the owner in to the calling flow,
# which goes on in the owner's browser, so the assistant never sees the link or holds a token of theirs. An
# email that is no user's gets nothing, so the assistant cannot tell whether an address belongs to a user.

resource_type: flow
id: 01900000-0000-7000-8000-0000000001a3
name: Personal Assistant Registration Approval Flow
handle: personal-assistant-registration-approval-flow
flowType: AUTHENTICATION
ouHandle: default
nodes:
- id: start
  type: START
  onSuccess: prompt_email
  layout:
    size:
      width: 101
      height: 34
    position:
      x: 0
      y: 200
- id: prompt_email
  type: PROMPT
  meta:
    components:
    - align: center
      type: TEXT
      id: text_approve_registration
      label: Approve your assistant's registration
      variant: HEADING_1
    - type: BLOCK
      id: block_email
      components:
      - id: input_email
        ref: email
        type: EMAIL_INPUT
        label: Owner's email
        required: true
      - type: ACTION
        id: action_send_link
        label: Email the owner a link
        variant: PRIMARY
        eventType: SUBMIT
  prompts:
  - inputs:
    - ref: input_email
      identifier: email
      type: EMAIL_INPUT
      required: true
    action:
      ref: action_send_link
      nextNode: generate_link
  layout:
    size:
      width: 350
      height: 300
    position:
      x: 200
      y: 0
# With no magicLinkURL, the link opens the callback page of ThunderID's sign-in pages (the gate), which
# verifies it and carries on with the flow. It lasts 5 minutes.
- id: generate_link
  type: TASK_EXECUTION
  properties:
    tokenExpiry: 300
  executor:
    name: MagicLinkExecutor
    mode: generate
    inputs:
    - identifier: email
      type: EMAIL_INPUT
      required: true
  onSuccess: send_link
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 640
      y: 175
- id: send_link
  type: TASK_EXECUTION
  properties:
    emailTemplate: magic-link
    senderId: 01990000-ba4c-7000-8000-000000000010
  executor:
    name: EmailExecutor
    mode: send
    inputs:
    - identifier: email
      type: EMAIL_INPUT
      required: true
  onSuccess: verify_link
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 920
      y: 175
# Asks for the link's token, which the gate submits when the owner opens the link, and signs in the user the
# link was sent to.
- id: verify_link
  type: TASK_EXECUTION
  executor:
    name: MagicLinkExecutor
    mode: verify
  onSuccess: auth_assert
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 1200
      y: 175
- id: auth_assert
  type: TASK_EXECUTION
  executor:
    name: AuthAssertExecutor
  onSuccess: end
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 1480
      y: 175
- id: end
  type: END
  layout:
    size:
      width: 85
      height: 34
    position:
      x: 1760
      y: 200
---
# The registration an assistant starts for itself, through the Bank Assistant Registration application, and its
# owner finishes in ThunderID's sign-in pages. The assistant answers its details: its name and the agent type's
# other attributes, its redirect URI and its JWKS URI. The flow then calls the approval flow, which emails the
# owner a link. Opening it signs the owner in to this flow, which makes them the agent's owner, and the rest of
# the flow runs in the owner's browser: they approve, and the page that follows shows the assistant identifier (the
# agent's OAuth client ID), which they paste back to the assistant.
#
# ThunderID returns that identifier only in the response to the request that creates the agent, and keeps it no
# longer, so the agent is created when the owner clicks Approve, and the page that request returns shows it.
# The flow fixes the agent's kind, so it registers only a personal agent, whatever the assistant sends. It
# requires a JWKS URI, so the agent signs in with its key and there is no client secret for the owner to carry.
# The assistant starts the flow with verbose on, since the gate draws its pages from the flow's components and
# a flow keeps the verbose setting it started with.
resource_type: flow
id: 01900000-0000-7000-8000-0000000001a4
name: Personal Assistant Self Registration Flow
handle: personal-assistant-self-registration-flow
flowType: REGISTRATION
ouHandle: default
nodes:
- id: start
  type: START
  onSuccess: prompt_agent_details
  layout:
    size:
      width: 101
      height: 34
    position:
      x: 0
      y: 200
# Answered by the assistant through the flow API, before the owner is involved. A prompt before the agent is
# provisioned cannot ask for the agent type's attributes by itself, so it names the default type's. The
# patterns hold the type's choices, so a value outside them is refused before the owner is emailed.
- id: prompt_agent_details
  type: PROMPT
  meta:
    components:
    - align: left
      type: TEXT
      id: text_header_agent_details
      label: Register your assistant
      variant: HEADING_1
    - type: BLOCK
      id: block_agent_details
      components:
      - id: input_agent_name
        ref: name
        type: TEXT_INPUT
        label: Name
        required: true
      - id: input_agent_model_provider
        ref: modelProvider
        type: TEXT_INPUT
        label: Model Provider
        required: false
      - id: input_agent_model
        ref: model
        type: TEXT_INPUT
        label: Model
        required: false
      - id: input_agent_function
        ref: function
        type: TEXT_INPUT
        label: Function
        required: false
      - id: input_agent_redirect_uris
        ref: redirectUris
        type: TEXT_INPUT
        label: Redirect URIs
        required: true
      - id: input_agent_jwks_uri
        ref: jwksUri
        type: TEXT_INPUT
        label: JWKS URI
        required: true
      - type: ACTION
        id: action_agent_details
        label: Continue
        variant: PRIMARY
        eventType: SUBMIT
  prompts:
  - inputs:
    - ref: input_agent_name
      identifier: name
      type: TEXT_INPUT
      required: true
    - ref: input_agent_model_provider
      identifier: modelProvider
      type: TEXT_INPUT
      required: false
      validation:
      - type: regex
        value: ^(openai|anthropic|gemini|mistral|custom)$
        message: 'Model provider must be one of: openai, anthropic, gemini, mistral, custom'
    - ref: input_agent_model
      identifier: model
      type: TEXT_INPUT
      required: false
    - ref: input_agent_function
      identifier: function
      type: TEXT_INPUT
      required: false
      validation:
      - type: regex
        value: ^(task-automation|rag-retrieval|code-gen|data-analysis|orchestrator|sub-agent|assistant|custom)$
        message: 'Function must be one of: task-automation, rag-retrieval, code-gen, data-analysis, orchestrator, sub-agent, assistant, custom'
    - ref: input_agent_redirect_uris
      identifier: redirectUris
      type: TEXT_INPUT
      required: true
    - ref: input_agent_jwks_uri
      identifier: jwksUri
      type: TEXT_INPUT
      required: true
    action:
      ref: action_agent_details
      nextNode: call_owner_approval
  layout:
    size:
      width: 350
      height: 560
    position:
      x: 200
      y: -200
- id: call_owner_approval
  type: CALL
  flow:
    ref: 01900000-0000-7000-8000-0000000001a3
  onSuccess: prompt_approve
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 640
      y: 175
# From here the flow runs in the owner's browser, on the gate's sign-in page that the emailed link opened.
- id: prompt_approve
  type: PROMPT
  meta:
    components:
    - alt: '{{ t(signin:images.app_logo.alt) }}'
      category: DISPLAY
      height: '60'
      id: image_prompt_approve
      resourceType: ELEMENT
      src: '{{ meta(application.logoUrl) }}'
      type: IMAGE
    - align: center
      type: TEXT
      id: text_header_approve
      label: Approve your assistant
      variant: HEADING_1
    - align: center
      type: TEXT
      id: text_approve_message
      label: Your assistant asked Sample Bank to register it as your assistant. Approve only if you asked it
        to. Registering gives it no access to your account; the first time it needs the bank, it asks you to
        approve what it may do.
      variant: BODY_1
    - type: BLOCK
      id: block_approve
      components:
      - type: ACTION
        id: action_approve
        label: Approve
        variant: PRIMARY
        eventType: SUBMIT
      - type: ACTION
        id: action_decline
        label: Decline
        variant: OUTLINED
        eventType: SUBMIT
  prompts:
  - inputs: []
    action:
      ref: action_approve
      nextNode: user_type_resolution
  - inputs: []
    action:
      ref: action_decline
      nextNode: registration_declined
  layout:
    size:
      width: 350
      height: 300
    position:
      x: 920
      y: -100
# ThunderID requires every registration flow to have a user type resolver. This flow registers only agents, so
# the step never runs: its condition never holds, and the flow goes on to the agent's type.
- id: user_type_resolution
  type: TASK_EXECUTION
  condition:
    key: never
    value: always
    onSkip: agent_type_resolution
  executor:
    name: UserTypeResolver
  onSuccess: agent_type_resolution
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 1340
      y: 400
- id: agent_type_resolution
  type: TASK_EXECUTION
  properties:
    allowedAgentTypes:
    - default
  executor:
    name: AgentTypeResolver
  onSuccess: agent_provisioning
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 1340
      y: 175
- id: agent_provisioning
  type: TASK_EXECUTION
  properties:
    includeOptional: true
  executor:
    name: ProvisioningExecutor
    inputs:
    - identifier: kind
      type: TEXT_INPUT
      required: true
      defaultValue: personal-assistant
      constant: true
    # The assistant signs in through the sample's sign-in flow, whose pages call it the owner's assistant.
    - identifier: authFlowHandle
      type: TEXT_INPUT
      required: true
      defaultValue: personal-assistant-sign-in-flow
      constant: true
    # Every assistant gets a robot as its logo.
    - identifier: logoUrl
      type: TEXT_INPUT
      required: true
      defaultValue: "emoji:🤖"
      constant: true
  onSuccess: agent_registered
  onIncomplete: fix_agent_details
  onFailure: fix_agent_details
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 1620
      y: 175
# Shown to the owner when the details the assistant gave cannot register it, such as a name another agent
# already has. The owner changes them here, and the flow tries again.
- id: fix_agent_details
  type: PROMPT
  meta:
    components:
    - alt: '{{ t(signin:images.app_logo.alt) }}'
      category: DISPLAY
      height: '60'
      id: image_fix_agent_details
      resourceType: ELEMENT
      src: '{{ meta(application.logoUrl) }}'
      type: IMAGE
    - align: center
      type: TEXT
      id: text_header_fix_agent_details
      label: Check your assistant's details
      variant: HEADING_1
    - type: BLOCK
      id: block_fix_agent_details
      components:
      - type: DYNAMIC_INPUT_PLACEHOLDER
        id: dynamic_agent_inputs
      - id: input_fix_agent_name
        ref: name
        type: TEXT_INPUT
        label: Name
        required: true
      - type: ACTION
        id: action_fix_agent_details
        label: Register assistant
        variant: PRIMARY
        eventType: SUBMIT
  prompts:
  - inputs:
    - ref: input_fix_agent_name
      identifier: name
      type: TEXT_INPUT
      required: true
    action:
      ref: action_fix_agent_details
      nextNode: agent_provisioning
  layout:
    size:
      width: 350
      height: 320
    position:
      x: 1620
      y: -350
# The assistant identifier is shown once: the page cannot get it again. The copy field is a top-level component, since the
# gate draws it only there.
- id: agent_registered
  type: PROMPT
  meta:
    components:
    - alt: '{{ t(signin:images.app_logo.alt) }}'
      category: DISPLAY
      height: '60'
      id: image_agent_registered
      resourceType: ELEMENT
      src: '{{ meta(application.logoUrl) }}'
      type: IMAGE
    - align: center
      type: TEXT
      id: text_header_agent_registered
      label: Your assistant is registered
      variant: HEADING_1
    - align: center
      type: TEXT
      id: text_agent_registered_message
      label: Copy the assistant identifier and paste it into your conversation with your assistant to finish its
        setup. This page shows it only once. You can then close this page.
      variant: BODY_1
    - type: COPYABLE_TEXT
      id: copy_agent_client_id
      label: Assistant identifier
      source: clientId
  message: Assistant registered
  next: registration_finished
  layout:
    size:
      width: 350
      height: 360
    position:
      x: 1900
      y: -100
- id: registration_declined
  type: PROMPT
  meta:
    components:
    - alt: '{{ t(signin:images.app_logo.alt) }}'
      category: DISPLAY
      height: '60'
      id: image_registration_declined
      resourceType: ELEMENT
      src: '{{ meta(application.logoUrl) }}'
      type: IMAGE
    - align: center
      type: TEXT
      id: text_header_registration_declined
      label: Registration declined
      variant: HEADING_1
    - align: center
      type: TEXT
      id: text_registration_declined_message
      label: Your assistant is not registered. You can close this page.
      variant: BODY_1
  message: Registration declined
  next: registration_finished
  layout:
    size:
      width: 350
      height: 200
    position:
      x: 1340
      y: -450
# A page that leads straight to the end completes the flow, and the gate's sign-in page then leaves it at once.
# So the two pages above stop here instead, and the owner closes them. The flow reaches this step only if the
# owner reloads one of them, and then ends.
- id: registration_finished
  type: PROMPT
  meta:
    components:
    - alt: '{{ t(signin:images.app_logo.alt) }}'
      category: DISPLAY
      height: '60'
      id: image_registration_finished
      resourceType: ELEMENT
      src: '{{ meta(application.logoUrl) }}'
      type: IMAGE
    - align: center
      type: TEXT
      id: text_header_registration_finished
      label: Registration finished
      variant: HEADING_1
    - align: center
      type: TEXT
      id: text_registration_finished_message
      label: You can close this page.
      variant: BODY_1
  message: Registration finished
  next: end
  layout:
    size:
      width: 350
      height: 200
    position:
      x: 2320
      y: -100
- id: end
  type: END
  layout:
    size:
      width: 85
      height: 34
    position:
      x: 2760
      y: 200

---
# --- the bank portal ----------------------------------------------------------

resource_type: application
id: 01990000-ba4c-7000-8000-000000000002
name: Bank Portal
description: Sample bank portal for customers and their assistants
type: browser
ouHandle: default
url: http://localhost:5173
# The sign-in and sign-up pages show the application's logo. Without one the gate shows a broken image, so
# the portal uses an emoji, which the gate draws as text.
logoUrl: "emoji:🏦"
authFlowHandle: bank-portal-sign-in-flow
registrationFlowHandle: bank-portal-registration-flow
isRegistrationFlowEnabled: true
allowedUserTypes:
  - person
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: bank-portal
      redirectUris:
        - http://localhost:5173
        - http://localhost:5173/admin/users
      postLogoutRedirectUris:
        - http://localhost:5173
      grantTypes:
        - authorization_code
        - refresh_token
      responseTypes:
        - code
      pkceRequired: true
      tokenEndpointAuthMethod: none
      publicClient: true
      token:
        accessToken:
          userConfig:
            # main lists an owner's agents (GET /users/me/agents) only in the organization unit the token names.
            attributes:
              - ouId
        idToken:
          validityPeriod: 3600
          userAttributes:
            - given_name
            - family_name
            - email
            - username
            - groups
      scopeClaims:
        profile:
          - given_name
          - family_name
          - username
        email:
          - email
        group:
          - groups

---
# --- the assistant registration application -------------------------------------
#
# An assistant starts its registration by running this application's self registration flow through
# ThunderID's flow API, and its owner finishes it in ThunderID's sign-in pages, from a link in an email. The
# application has no OAuth client, so it issues no tokens. It binds the approval flow as its sign-in flow,
# since the sign-in flow an application's flows call must be the one it binds.

resource_type: application
id: 01990000-ba4c-7000-8000-000000000004
name: Bank Assistant Registration
description: Runs the registration an assistant starts for itself, which its owner approves from an email
type: custom
ouHandle: default
logoUrl: "emoji:🏦"
authFlowHandle: personal-assistant-registration-approval-flow
registrationFlowHandle: personal-assistant-self-registration-flow
isRegistrationFlowEnabled: true
allowedUserTypes:
  - person

---
# --- email ----------------------------------------------------------------------
#
# The approval email goes through the sample SMTP server (sample-apps/smtp-server), which keeps every
# message in its inbox at http://127.0.0.1:8788 instead of delivering it. The approval flow names this
# connection as its sender, and sends ThunderID's own magic link email: the Console's import does not take
# notification templates, so the sample does not bring one of its own.

resource_type: connection
id: 01990000-ba4c-7000-8000-000000000010
type: email-smtp
ouHandle: default
name: Sample SMTP server
description: The sample SMTP server, whose inbox is at http://127.0.0.1:8788
host: 127.0.0.1
port: 2525
fromAddress: no-reply@bank.sample.local
fromName: Sample Bank
# The sample server has no TLS and takes mail without signing in, and ThunderID never sends credentials over
# a plaintext connection, so the connection uses none.
tls: none
authentication:
  type: none

---
# --- the bank API's own client --------------------------------------------------
#
# The bank API checks every token with ThunderID's introspection endpoint, so a token that was revoked (an
# owner or administrator suspended the agent, or the account was suspended or deleted) stops working at once,
# not when it expires. Introspection needs client authentication, so the bank API has a client of its own.
# Its client secret is not in this file: scripts/generate-secrets.sh creates it in .env (BANK_API_CLIENT_SECRET),
# scripts/setup.sh stores it in ThunderID's secret store under the name below, and the import resolves the
# sec: reference from there. The bank API reads the same value from .env.

resource_type: application
id: 01990000-ba4c-7000-8000-000000000003
name: Bank API
description: The bank API's own client, used to introspect the tokens it is given
type: m2m
ouHandle: default
# An emoji logo, like the portal's, so the application shows an icon instead of a broken image.
logoUrl: "emoji:🏦"
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: bank-api
      clientSecret: sec:APPLICATION__01990000BA4C70008000000000000003__CLIENT_SECRET
      grantTypes:
        - client_credentials
      tokenEndpointAuthMethod: client_secret_basic
      publicClient: false

---
# --- let the portal call ThunderID from the browser ---------------------------
#
# The Vue SDK calls ThunderID's discovery, token and user endpoints from the browser, so the portal's
# origin must be allowed. Importing this replaces ThunderID's whole list instead of adding to it, so it also
# keeps ThunderID's own origin, where its sign-in pages and Admin Console run. Add any other origin you need.

resource_type: server_config
name: cors
value:
  allowedOrigins:
    - http://localhost:5173
    - https://localhost:8090
