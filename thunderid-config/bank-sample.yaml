# ThunderID resources for the personal agent bank sample.
#
# Import into a running ThunderID (Console -> Import, or POST /import). Import is upsert by id, so
# re-importing is safe. Everything is prefixed `bank-sample-` or uses its own identifiers.
#
# What it sets up:
#   - The Bank API resource server, with the permissions bank:read, bank:write and bank:admin.
#   - Three demo users, john, carol and bob, all bank customers.
#   - Two roles: Bank Customer (read and write) for the demo users, and Bank Admin (read, write and
#     admin) for ThunderID's built-in Administrators group.
#   - The Bank Portal application: a browser app users sign in and sign up to, with the registration
#     flow that also registers personal assistants.
#   - The portal's sign-in flow (username and password) and the user and personal assistant registration flow
#     the portal binds.
#   - The sign-in flow every assistant the sample registers signs in through, with the owner's username and
#     password.
#   - The Bank Assistant Registration application, whose self registration flow an assistant runs to
#     register itself, and the registration approval flow it calls, which emails the owner a magic link.
#   - The sample SMTP server as an email connection, which the approval email goes through.
#   - bank-audit-agent, a standard agent the bank runs for itself, owned by ThunderID's administrator.
#   - Allows the portal's origin to call ThunderID from the browser (the cors server configuration).

# --- the bank API -------------------------------------------------------------

resource_type: resource_server
id: bank-sample-api
name: Bank API
description: The sample bank's account API
identifier: https://bank.sample.local/api
ouHandle: default
delimiter: ":"
resources:
  - name: Bank
    handle: bank
    actions:
      - name: Read
        handle: read
        description: View balances and transactions
      - name: Write
        handle: write
        description: Make transfers
      - name: Admin
        handle: admin
        description: Administer the bank

---
# --- demo users ---------------------------------------------------------------

resource_type: user
id: bank-sample-john
type: person
ouHandle: default
attributes:
  username: john
  email: john@bank.sample.local
  given_name: John
  family_name: Anderson
credentials:
  password: "john"

---
resource_type: user
id: bank-sample-carol
type: person
ouHandle: default
attributes:
  username: carol
  email: carol@bank.sample.local
  given_name: Carol
  family_name: Clark
credentials:
  password: "carol"

---
resource_type: user
id: bank-sample-bob
type: person
ouHandle: default
attributes:
  username: bob
  email: bob@bank.sample.local
  given_name: Bob
  family_name: Brown
credentials:
  password: "bob"

---
# --- roles: customers can read and write, administrators can also administer ---

resource_type: role
id: bank-sample-customer
name: Bank Customer
description: Views the account and makes transfers
ouHandle: default
permissions:
  - resourceServerId: bank-sample-api
    permissions:
      - bank:read
      - bank:write
assignments:
  - id: bank-sample-john
    type: user
  - id: bank-sample-carol
    type: user
  - id: bank-sample-bob
    type: user

---
# The Administrators group is ThunderID's own (bootstrap/01-default-resources.yaml), which holds the
# built-in admin user.
resource_type: role
id: bank-sample-admin
name: Bank Admin
description: Views the account, makes transfers and administers the bank
ouHandle: default
permissions:
  - resourceServerId: bank-sample-api
    permissions:
      - bank:read
      - bank:write
      - bank:admin
assignments:
  - id: 01900000-0000-7000-8000-000000000040
    type: group

---
# --- a standard agent ---------------------------------------------------------
#
# An agent the bank runs for itself, owned by ThunderID's administrator (the bootstrap user admin,
# bootstrap/01-default-resources.yaml). Unlike an assistant it acts for no customer: it has no owner to sign in
# for it, and only an administrator manages it. The admin dashboard lists it under Other agents, and while it
# exists ThunderID refuses to delete its owner.

resource_type: agent
id: bank-sample-audit-agent
type: default
ouHandle: default
owner:
  id: 01900000-0000-7000-8000-000000000030
description: Reviews the bank's transactions for unusual activity. Run by the bank, not by a customer.
attributes:
  name: bank-audit-agent
  function: data-analysis

---
# --- sign-in and registration flows for the portal ----------------------------
#
# The portal's own sign-in flow, which customers and the administrator sign in to the portal with: a username
# and password. Assistants sign in through the personal assistant sign-in flow instead.
#
# The registration flow below is copied from the user and personal assistant registration sample. It starts
# with a choice: create an account, or register a personal assistant. The assistant branch registers the
# assistant for the user of the token the flow runs with, who must have signed in to the application that runs
# it. The portal's Register manually form, on its Assistants tab, starts it after sign-in and takes the assistant
# branch.

resource_type: flow
id: 01900000-0000-7000-8000-0000000001a1
name: Bank Portal Sign-in Flow
handle: bank-portal-sign-in-flow
flowType: AUTHENTICATION
ouHandle: default
nodes:
- id: start
  type: START
  onSuccess: choose_auth_method
  layout:
    size:
      width: 101
      height: 34
    position:
      x: 0
      y: 200
- id: choose_auth_method
  type: PROMPT
  meta:
    components:
    - alt: '{{ t(signin:images.app_logo.alt) }}'
      category: DISPLAY
      height: '60'
      id: image
      resourceType: ELEMENT
      src: '{{ meta(application.logoUrl) }}'
      type: IMAGE
    - align: center
      type: TEXT
      id: text_sign_in
      label: 'Sign in to {{ meta(application.name) }}'
      variant: HEADING_1
    - type: BLOCK
      id: block_sign_in
      components:
      - id: input_username
        ref: username
        type: TEXT_INPUT
        label: '{{ t(signin:forms.credentials.fields.username.label) }}'
        required: true
        placeholder: '{{ t(signin:forms.credentials.fields.username.placeholder) }}'
      - id: input_password
        ref: password
        type: PASSWORD_INPUT
        label: '{{ t(signin:forms.credentials.fields.password.label) }}'
        required: true
        placeholder: '{{ t(signin:forms.credentials.fields.password.placeholder) }}'
      - type: ACTION
        id: action_sign_in
        label: '{{ t(signin:forms.credentials.actions.submit.label) }}'
        variant: PRIMARY
        eventType: SUBMIT
  prompts:
  - inputs:
    - ref: input_username
      identifier: username
      type: TEXT_INPUT
      required: true
    - ref: input_password
      identifier: password
      type: PASSWORD_INPUT
      required: true
    action:
      ref: action_sign_in
      nextNode: credentials_auth
  layout:
    size:
      width: 350
      height: 520
    position:
      x: 200
      y: 0
- id: credentials_auth
  type: TASK_EXECUTION
  executor:
    name: CredentialsAuthExecutor
  onSuccess: authorization_check
  onIncomplete: choose_auth_method
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 680
      y: 160
- id: authorization_check
  type: TASK_EXECUTION
  executor:
    name: AuthorizationExecutor
  onSuccess: auth_assert
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 1960
      y: 160
- id: auth_assert
  type: TASK_EXECUTION
  executor:
    name: AuthAssertExecutor
  onSuccess: end
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 2240
      y: 160
- id: end
  type: END
  layout:
    size:
      width: 85
      height: 34
    position:
      x: 2520
      y: 200
---
# The sign-in an assistant runs when it gets access to the bank, on behalf of its owner: the owner signs in with their
# username and password, the bank checks what they may grant, and they approve what the assistant may do. It follows
# ThunderID's personal agent sign-in flow (default-personal-agent-auth-flow), with the sample's wording, which calls
# the agent the owner's assistant. ThunderID still accepts only the assistant's owner. The registration flows bind it
# to every assistant they create; {{ meta(application.name) }} is the assistant's name.

resource_type: flow
id: 01900000-0000-7000-8000-0000000001a5
name: Personal Assistant Sign-in Flow
handle: personal-assistant-sign-in-flow
flowType: AUTHENTICATION
ouHandle: default
nodes:
- id: start
  type: START
  onSuccess: prompt_credentials
  layout:
    size:
      width: 85
      height: 34
    position:
      x: 0
      y: 200
- id: prompt_credentials
  type: PROMPT
  meta:
    components:
    - align: center
      type: TEXT
      id: heading_credentials
      label: Sign in to approve your assistant
      variant: HEADING_1
    - align: center
      type: TEXT
      id: subtitle_credentials
      label: '{{ meta(application.name) }} asks to act for you at Sample Bank. Sign in with your username and password.'
      variant: BODY_1
    - type: BLOCK
      id: block_credentials
      components:
      - id: input_username
        ref: username
        type: TEXT_INPUT
        label: '{{ t(signin:forms.credentials.fields.username.label) }}'
        required: true
        placeholder: '{{ t(signin:forms.credentials.fields.username.placeholder) }}'
      - id: input_password
        ref: password
        type: PASSWORD_INPUT
        label: '{{ t(signin:forms.credentials.fields.password.label) }}'
        required: true
        placeholder: '{{ t(signin:forms.credentials.fields.password.placeholder) }}'
      - type: ACTION
        id: action_sign_in
        label: '{{ t(signin:forms.credentials.actions.submit.label) }}'
        variant: PRIMARY
        eventType: SUBMIT
  prompts:
  - inputs:
    - ref: input_username
      identifier: username
      type: TEXT_INPUT
      required: true
    - ref: input_password
      identifier: password
      type: PASSWORD_INPUT
      required: true
    action:
      ref: action_sign_in
      nextNode: credentials_auth
  layout:
    size:
      width: 350
      height: 400
    position:
      x: 200
      y: 100
- id: credentials_auth
  type: TASK_EXECUTION
  executor:
    name: CredentialsAuthExecutor
  onSuccess: authorization_check
  onIncomplete: prompt_credentials
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 650
      y: 200
- id: authorization_check
  type: TASK_EXECUTION
  executor:
    name: AuthorizationExecutor
  onSuccess: consent_check
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 920
      y: 280
- id: consent_check
  type: TASK_EXECUTION
  executor:
    name: ConsentExecutor
  onSuccess: auth_assert
  onIncomplete: prompt_consent
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 1200
      y: 280
- id: prompt_consent
  type: PROMPT
  meta:
    components:
    - align: center
      type: TEXT
      id: consent_heading
      label: Approve your assistant
      variant: HEADING_3
    - align: center
      type: TEXT
      id: consent_assistant_message
      label: '{{ meta(application.name) }}, your assistant, asks to act for you at Sample Bank.'
      variant: BODY_1
    - align: center
      type: TEXT
      id: consent_message
      label: Review what is being requested and choose what to allow.
      variant: BODY_1
    - type: BLOCK
      id: consent_block
      components:
      - id: consent_input
        ref: consent_decisions
        type: CONSENT_INPUT
        required: true
      - type: ACTION
        id: consent_action_allow
        label: '{{ t(consent:allow) }}'
        variant: PRIMARY
        eventType: SUBMIT
      - type: ACTION
        id: consent_action_deny
        label: '{{ t(consent:deny) }}'
        variant: SECONDARY
        eventType: SUBMIT
  prompts:
  - inputs:
    - ref: consent_input
      identifier: consent_decisions
      type: CONSENT_INPUT
      required: true
    action:
      ref: consent_action_allow
      nextNode: consent_check
  - inputs:
    - ref: consent_input
      identifier: consent_decisions
      type: CONSENT_INPUT
      required: true
    action:
      ref: consent_action_deny
      nextNode: consent_check
  layout:
    size:
      width: 350
      height: 420
    position:
      x: 1200
      y: 480
- id: auth_assert
  type: TASK_EXECUTION
  executor:
    name: AuthAssertExecutor
  onSuccess: end
  layout:
    size:
      width: 206
      height: 113
    position:
      x: 1640
      y: 280
- id: end
  type: END
  layout:
    size:
      width: 85
      height: 34
    position:
      x: 1920
      y: 300
